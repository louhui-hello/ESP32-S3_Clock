; ESP32-S3 Clock — u8g2 + 0.91" OLED(SSD1306 128x32) + 内部 RTC
; 板子: ESP32S3N16R8 (16MB flash / 8MB PSRAM)
; I2C:  SDA=GPIO9  SCL=GPIO8   OLED=0x3C
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
monitor_filters = direct
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
lib_deps =
    olikraus/U8g2@^2.36.5
